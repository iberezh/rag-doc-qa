# Full stack: `docker compose up` builds and runs Postgres + the NestJS API + the Next.js web.
# Set GROQ_API_KEY in .env for real answers (otherwise the API uses the mock LLM), and
# JWT_SECRET for a non-default signing key. Then open http://localhost:3000.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Host port is overridable (set POSTGRES_PORT) to avoid clashing with a local Postgres.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      # Required — no insecure default. `cp .env.example .env` sets it; generate a real one
      # with `openssl rand -hex 32`. Compose aborts if it is unset.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Same-origin proxy: the browser calls /api/* and Next forwards to the api service,
      # keeping the httpOnly auth cookie first-party.
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
