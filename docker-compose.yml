# Phase 0 skeleton: a real Postgres + pgvector service for local dev (used from Phase 1).
# The api/web image builds are added in Phase 7 (see docs/SCOPE.md). For now run the apps
# with `pnpm --filter api dev` and `pnpm --filter web dev` against this database.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
